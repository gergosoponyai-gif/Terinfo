<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Szentirmai Soma Javateszt</title>
</head>
<body>

<h1>Az első JavaScriptem</h1>

<p>A JavaScript képes megváltoztatni egy HTML-elem tartalmát:</p>

<button type="button" onclick="myFunction()">Kattints rám!</button>

<p id="demo">Ezt figyeld!</p>

<script>
let kattintas = 0;

function myFunction() {
    kattintas++;

    if (kattintas == 1) {
        document.getElementById("demo").innerHTML = "Tényleg rányomtál";
    } 
	else if (kattintas == 2) {
        document.getElementById("demo").innerHTML = "Megint megnyomtad?";
    }
	else if (kattintas == 3) {
        document.getElementById("demo").innerHTML = "Elég lesz!";
	}
}
</script>

</body>
</html>
